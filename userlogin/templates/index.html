{% extends 'base.html' %}
{% block content %}
  <form class="w3-mobile w3-card-4 w3-container w3-padding" style="width:40%;margin:auto;" action="{{ url_for('userlogin') }}" method="POST" id="login-form">
    <p>
      <label><b>E-MAIL</b></label>
      <input type="email" name="email" id="email" class="w3-input w3-border" required>
    </p>
    <p>
      <label><b>PASSWORD</b></label>
      <input type="password" name="password" id="password" class="w3-input w3-border" required>
    </p>
    <p class="w3-right">
      <input type="submit" value="LOGIN" id="login-btn" class="w3-button w3-blue">
    </p>
    <p style="clear:both;text-align:center;">No account yet? <a href="{{ url_for('register') }}" id="register-link">Register here</a></p>
  </form>
{% endblock %}

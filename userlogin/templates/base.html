<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/w3.css') }}">
    <title>USER LOGIN</title>
  </head>
  <body>
    <div class="w3-container w3-padding w3-indigo w3-bar">
      <span class="w3-bar-item">USER LOGIN v1.1</span>
      {% block logout %}{% endblock %}
    </div>
    <div class="w3-container w3-padding-16">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="w3-panel w3-card-4 {{ 'w3-green' if category == 'success' else 'w3-red' }}" style="max-width:420px;margin:8px auto;" id="flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
    <center>
      <hr>
      Copyright &copy; Mandawe, Ivan Jae D. 2026
    </center>
  </body>
</html>
